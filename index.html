<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FamilyChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PANTALLA DE INICIO
    ========================== -->

    <main id="homeScreen" class="app">

        <div class="logo">
            🏠
            <h1>FamilyChat</h1>
            <p>Tu chat familiar privado</p>
        </div>

        <div class="menu">

            <button id="createBtn">
                👑 Crear familia
            </button>

            <button id="joinBtn">
                🔑 Unirse a una familia
            </button>

        </div>

    </main>


    <!-- =========================
         MODAL
    ========================== -->

    <div id="modal" class="modal hidden">

        <div class="modal-box">

            <button id="closeBtn" class="close">
                ✕
            </button>

            <h2 id="modalTitle">
                Crear familia
            </h2>


            <!-- CREAR FAMILIA -->

            <div id="familyNameContainer">

                <label>
                    Nombre de la familia
                </label>

                <input
                    id="familyName"
                    type="text"
                    placeholder="Flia. Escalante"
                    maxlength="40"
                >

            </div>


            <!-- UNIRSE A FAMILIA -->

            <div id="codeContainer" class="hidden">

                <label>
                    Código de familia
                </label>

                <input
                    id="familyCode"
                    type="text"
                    placeholder="FAM-3BYC"
                    maxlength="8"
                >

            </div>


            <!-- NOMBRE DEL USUARIO -->

            <label>
                Tu nombre
            </label>

            <input
                id="userName"
                type="text"
                placeholder="Mical"
                maxlength="30"
            >


            <button id="continueBtn" class="continue">
                Continuar
            </button>


            <p id="result"></p>

        </div>

    </div>


    <!-- =========================
         PANTALLA PRINCIPAL
    ========================== -->

    <main id="chatScreen" class="chat-screen hidden">

        <header class="chat-header">

            <div>

                <h2 id="familyTitle">
                    🏠 Familia
                </h2>

                <p id="welcomeText">
                    Bienvenido
                </p>

            </div>

            <button id="logoutBtn">
                🚪 Salir
            </button>

        </header>


        <section class="dashboard">

            <!-- =====================
                 MIEMBROS
            ====================== -->

            <div class="section-title">
                👨‍👩‍👧 Familia
            </div>

            <div id="memberList" class="chat-list">

                <div class="empty-message">
                    Cargando familiares...
                </div>

            </div>


            <!-- =====================
                 CHATS
            ====================== -->

            <div class="section-title groups-title">
                💬 Chats
            </div>

            <div id="chatList" class="chat-list">

                <div class="empty-message">
                    Todavía no tenés conversaciones.
                </div>

            </div>


            <!-- =====================
                 GRUPOS
            ====================== -->

            <div class="section-title groups-title">
                👥 Grupos
            </div>

            <div id="groupList" class="chat-list">

                <div class="empty-message">
                    Todavía no tenés grupos.
                </div>

            </div>


            <button id="createGroupBtn" class="create-group">
                ＋ Crear grupo
            </button>

        </section>

    </main>


    <!-- =========================
         VENTANA DE CHAT
    ========================== -->

    <div
        id="conversationScreen"
        class="conversation-screen hidden"
    >

        <header class="conversation-header">

            <button id="backChatBtn">
                ←
            </button>

            <div>

                <h2 id="conversationName">
                    Chat
                </h2>

                <p>
                    Conversación privada
                </p>

            </div>

        </header>


        <!-- MENSAJES -->

        <div id="messages" class="messages">

            <div class="empty-message">
                No hay mensajes todavía.
            </div>

        </div>


        <!-- ESCRIBIR MENSAJE -->

        <div class="message-box">

            <input
                id="messageInput"
                type="text"
                placeholder="Escribí un mensaje..."
                maxlength="500"
            >

            <button id="sendMessageBtn">
                ➤
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>
